apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: network-services
  labels:
    app: adguard-home
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: adguard-home
        image: adguard/adguardhome:latest
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        ports:
        - containerPort: 53
          hostPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          hostPort: 53
          protocol: TCP
          name: dns-tcp
        - containerPort: 30080
          hostPort: 30080
          protocol: TCP
          name: admin-web
        volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: adguard-work
        - mountPath: /opt/adguardhome/conf
          name: adguard-conf
      volumes:
      - name: adguard-work
        hostPath:
          path: /mnt/storage/adguard/work
          type: Directory
      - name: adguard-conf
        hostPath:
          path: /mnt/storage/adguard/conf
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-service
  namespace: network-services
spec:
  type: ClusterIP
  ports:
  - port: 30080
    targetPort: 30080
    name: admin-http
  - port: 53
    targetPort: 53
    protocol: UDP
    name: dns-udp
  - port: 53
    targetPort: 53
    protocol: TCP
    name: dns-tcp
  selector:
    app: adguard-home
